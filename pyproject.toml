[project]
name = "incidentops"
version = "0.1.0"
description = "Evidence-grounded incident investigation with durable async RAG workflows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "langsmith>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "tiktoken>=0.9,<1",
  "langchain-text-splitters>=1,<2",
  "sqlalchemy[asyncio]>=2,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.20,<1",
  "alembic>=1.15,<2",
  "celery>=5.6,<6",
  "boto3>=1.35,<2",
  "pinecone>=7,<10",
  "rank-bm25>=0.2,<1",
  "pgvector>=0.4,<1",
]

[project.scripts]
incidentops = "incidentops.cli:main"
incidentops-workflow = "incidentops.durable.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "pytest-asyncio>=1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "postgres: requires INCIDENTOPS_TEST_POSTGRES_URL pointing to a disposable database",
  "broker: requires INCIDENTOPS_TEST_BROKER_URL pointing to disposable RabbitMQ",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
