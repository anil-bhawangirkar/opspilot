[project]
name = "incidentops"
version = "0.1.0"
description = "Evidence-grounded cloud incident knowledge assistant — learning increment 1"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "langsmith>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "tiktoken>=0.9,<1",
]

[project.scripts]
incidentops = "incidentops.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires INCIDENTOPS_TEST_POSTGRES_URL pointing to a disposable database"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
